<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" role="img" aria-labelledby="title description">
  <title id="title">Edmonton Gallery Walk map</title>
  <desc id="description">A simplified north-to-south map of six galleries along 124 Street between 107 Avenue and Jasper Avenue.</desc>

  <rect width="800" height="1200" fill="#fffdf6"/>

  <g fill="none" stroke="#111111" stroke-linecap="square">
    <path d="M270 210H735 M270 365H735 M270 520H735 M270 750H735 M270 930H735 M270 1080H735" stroke-width="4"/>
    <path d="M350 180V1110" stroke-width="7"/>
    <path d="M372 180V1110" stroke-width="3"/>
    <path d="M350 180H372V1110H350Z" fill="#fffdf6" stroke-width="4"/>
  </g>

  <g fill="#111111" font-family="Open Sans, Arial, sans-serif" font-weight="700">
    <text x="36" y="220" font-size="31">107 Ave</text>
    <text x="36" y="375" font-size="31">106 Ave</text>
    <text x="36" y="530" font-size="31">104 Ave</text>
    <text x="36" y="940" font-size="31">103 Ave</text>
    <text x="36" y="1090" font-size="31">Jasper Ave</text>
    <text x="325" y="700" font-size="28" text-anchor="middle" transform="rotate(-90 325 700)">124 Street</text>
  </g>

  <g fill="#111111" font-family="Open Sans, Arial, sans-serif" font-weight="700">
    <text x="78" y="76" font-size="30" text-anchor="middle">N</text>
    <path d="M78 95L40 170L78 154L116 170Z" fill="#111111"/>
  </g>

  <g stroke="#111111" stroke-width="3">
    <circle cx="435" cy="285" r="42" fill="#0b7a75"/>
    <circle cx="435" cy="440" r="42" fill="#f0643b"/>
    <circle cx="435" cy="595" r="42" fill="#78a94b"/>
    <circle cx="435" cy="750" r="42" fill="#57c9c3"/>
    <circle cx="285" cy="855" r="42" fill="#ec78aa"/>
    <circle cx="285" cy="1005" r="42" fill="#6b338e"/>
  </g>

  <g fill="#111111" font-family="Open Sans, Arial, sans-serif" font-size="31" font-weight="700">
    <text x="510" y="296">MAUD Gallery</text>
    <text x="510" y="451">Bearclaw Gallery</text>
    <text x="510" y="606">Lando Gallery</text>
    <text x="510" y="761">West End Gallery</text>
    <text x="355" y="866">Peter Robertson Gallery</text>
    <text x="355" y="1016">Bugera Lamb Gallery</text>
  </g>
</svg>
