    <g transform="translate(690 3505)">
      <circle r="36" fill="#0B7A75" stroke="#FFFDF6" stroke-width="7"/>
      <text x="90" y="-2" fill="#FFFDF6" font-size="50" font-weight="800">MAUD Gallery</text>
      <text x="90" y="44" fill="#C9C6BC" font-size="27" font-weight="600">#307, 10643 124 Street NW</text>
    </g>
    <g transform="translate(690 3670)">
      <circle r="36" fill="#F0643B" stroke="#FFFDF6" stroke-width="7"/>
      <text x="90" y="-2" fill="#FFFDF6" font-size="50" font-weight="800">Bearclaw Gallery</text>
      <text x="90" y="44" fill="#C9C6BC" font-size="27" font-weight="600">10403 124 Street NW</text>
    </g>
    <g transform="translate(690 3840)">
      <circle r="36" fill="#78A94B" stroke="#FFFDF6" stroke-width="7"/>
      <text x="90" y="-2" fill="#FFFDF6" font-size="50" font-weight="800">Lando Gallery</text>
      <text x="90" y="44" fill="#C9C6BC" font-size="27" font-weight="600">10345 124 Street NW</text>
    </g>
    <g transform="translate(690 4020)">
      <circle r="36" fill="#57C9C3" stroke="#FFFDF6" stroke-width="7"/>
      <text x="90" y="-2" fill="#FFFDF6" font-size="50" font-weight="800">West End Gallery</text>
      <text x="90" y="44" fill="#C9C6BC" font-size="27" font-weight="600">10337 124 Street NW</text>
    </g>
    <g transform="translate(690 4190)">
      <circle r="36" fill="#EC78AA" stroke="#FFFDF6" stroke-width="7"/>
      <text x="90" y="-2" fill="#FFFDF6" font-size="50" font-weight="800">Peter Robertson Gallery</text>
      <text x="90" y="44" fill="#C9C6BC" font-size="27" font-weight="600">10332 124 Street NW</text>
    </g>
    <g transform="translate(690 4390)">
      <circle r="36" fill="#6B338E" stroke="#FFFDF6" stroke-width="7"/>
      <text x="90" y="-2" fill="#FFFDF6" font-size="50" font-weight="800">Bugera Lamb Gallery</text>
      <text x="90" y="44" fill="#C9C6BC" font-size="27" font-weight="600">1B, 10110 124 Street NW</text>
