    <text x="390" y="3600" text-anchor="end">106 AVE</text>
    <text x="390" y="3770" text-anchor="end">104 AVE</text>
    <text x="390" y="3950" text-anchor="end">103 AVE</text>
    <text x="390" y="4310" text-anchor="end">JASPER AVE</text>
    <text x="580" y="4190" fill="#F0643B" font-size="32" font-weight="800" text-anchor="middle" transform="rotate(-90 580 4190)">124 STREET</text>
  </g>

