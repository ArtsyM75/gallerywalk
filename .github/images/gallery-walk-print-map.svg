  <g font-family="Open Sans, Arial, sans-serif">
    <text x="180" y="4760" fill="#111111" font-size="76" font-weight="800">EDMONTONGALLERYWALK.COM</text>
    <text x="180" y="4870" fill="#F0643B" font-size="40" font-weight="800">ART · EXHIBITIONS · 124 STREET</text>
    <text x="180" y="4990" fill="#111111" font-size="28">Map not to scale</text>
    <text x="3120" y="4990" fill="#111111" font-size="34" font-weight="700" text-anchor="end">EDMONTON, ALBERTA</text>
